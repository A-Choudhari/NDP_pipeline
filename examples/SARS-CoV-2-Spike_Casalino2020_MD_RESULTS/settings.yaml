ndp:
  defaults:
    lab: "Amaro Lab, UC San Diego"
    data_availability: "Trajectories stored on lab storage; available on request"
    keywords: [molecular dynamics, Amaro Lab]
    base_url:    # where records/ is hosted, e.g. https://raw.githubusercontent.com/<org>/<repo>/main/records
    protocol: production    # production (published) | all (+ min/heating/NPT) | none
    lengths: all    # all (every replica, marked) | nominal (only full-length ones)

  datasets:
    CLOSED:
      glycan_profile: "66 N-glycans (22 per chain: G1-G22 chain A, G25-G46 chain B, G48-G69 chain C) and 4 O-glycans (G23, G24 chain A; G47 chain B; G70 chain C), all on glycan chain G. Residues used: BGLN, AGAN, BGAL, BMAN, AMAN, AFUC, ANE5 (complex, hybrid and oligomannose N-glycans)."
      ions: "150 mM NaCl (Na+/Cl-), neutralising"
      water_model: TIP3P
      related_publication: https://doi.org/10.1021/acscentsci.0c01056
      keywords: [SARS-CoV-2, spike glycoprotein, glycan shield, molecular dynamics, NAMD, CHARMM36]
    MUTANT:
      glycan_profile: "60 N-glycans (20 per chain: G6/G7, G30/G31 and G53/G54 removed with the N165A and N234A substitutions) and 4 O-glycans (G23, G24 chain A; G47 chain B; G70 chain C), all on glycan chain G. Residues used: BGLN, AGAN, BGAL, BMAN, AMAN, AFUC, ANE5."
      ions: "150 mM NaCl (Na+/Cl-), neutralising"
      water_model: TIP3P
      related_publication: https://doi.org/10.1021/acscentsci.0c01056
      keywords: [SARS-CoV-2, spike glycoprotein, glycan shield, molecular dynamics, NAMD, CHARMM36]
