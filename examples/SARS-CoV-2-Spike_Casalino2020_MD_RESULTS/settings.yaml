  #   Write `frame_interval_ps:` below and the lengths follow from it.
  # ----------------------------------------------------------------------
  - id: CLOSED/d8dbb86a
    identifier: AMARO-SARSCOV2-SPIKE-CLOSED
    topic: covid-19
    tags: [spike, closed-state, glycans, SARS-CoV-2]
    title: "SARS-CoV-2 full-length spike glycoprotein, closed state: all-atom MD"
    description: "All-atom MD simulations of the full-length SARS-CoV-2 spike glycoprotein in the closed state (all RBDs 'down'), protein + glycans only (not aligned). PSF and DCD files are provided. 3 replicas."
    force_field: "CHARMM36 all-atom additive"
    water_model: TIP3P
    software: "NAMD 2.14 (Frontera, TACC)"
    ensemble: NPT
    temperature_K: 310
    pressure_bar: 1.01325
    timestep_fs: 2
    frame_interval_ps: 100
    construct: "Full-length SARS-CoV-2 spike glycoprotein homotrimer, residues 16-1273 per chain (chains A, B, C; segments S1 16-685, S2 686-1273), in the closed state (all RBDs 'down'). Non-canonical residues: HSD/HSE neutral histidines, CYP palmitoylated cysteine. Shared trajectories hold protein + glycans only and are not aligned; water, ions and the POPC/POPS/POPI/POPE/CHL bilayer were stripped."
    starting_structure: "PDB 6VXX (all RBDs 'down')"
    glycan_profile: "66 N-glycans (22 per chain: G1-G22 chain A, G25-G46 chain B, G48-G69 chain C) and 4 O-glycans (G23, G24 chain A; G47 chain B; G70 chain C), all on glycan chain G. Residues used: BGLN, AGAN, BGAL, BMAN, AMAN, AFUC, ANE5 (complex, hybrid and oligomannose N-glycans)."
    ions: "150 mM NaCl (Na+/Cl-), neutralising"
    related_publication: https://doi.org/10.1021/acscentsci.0c01056
    keywords: [SARS-CoV-2, spike glycoprotein, glycan shield, molecular dynamics, NAMD, CHARMM36]
    slug: spike-fulllength-closed

