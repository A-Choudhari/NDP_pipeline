  caption: 'Accessibility of the membrane-proximal external region (MPER) peptide epitope
    relative to Env tilt angle. a Molecular representation of the HIV-1 Env in a tilted conformation
    shown from a side view, with the MPER peptide epitope (residues 671–683) highlighted in
