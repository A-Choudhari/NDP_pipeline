- figure: 5
  file: fig5.png
  section: paper
  title: Glycan shield of HIV-1 Env.
  caption: 'Glycan shield of HIV-1 Env. a, b Molecular representations of the HIV-1 Env trimer’s
    glycan shield, shown from a side view (a) and a top-down view (b). Glycans are shown as
    a blue mesh ensemble of overlaid conformations sampled during a 1 µs-long simulation.
    The protein is represented by a cyan surface, while the membrane is depicted in purple,
    with lipid headgroups represented as van der Waals spheres. c Quantification of the accessible
    surface area (cyan), glycanshielded area (dark blue), and membrane-occluded area (purple)
    in Å2 across probe radii ranging from 1.4 Å to 8 Å (x-axis), with relative percentages
    indicated within each stacked bar. For each stacked bar, values were pooled across five
    independent simulation trajectories (n = 5) initiated with distinct velocity seeds. Within
    each trajectory, surface areas were calculated over 1051 sampled frames. Error bars indicate
    the standard deviation of the pooled values across all sampled frames. d Overview of the
    HIV-1 Env trimer’s major antigenic regions. The protein is represented with a light gray
    surface, and the antigenic regions are highlighted in distinct colors: CD4 binding site
    (CD4bs, pink), V1V2 (green), V3 (cyan), silent face (dark gray), gp120-gp41 interface
    (red), fusion peptide (FP, yellow), and the membrane-proximal external region (MPER, orange).
    Glycans are depicted as blue sticks. e Alternate representation of the Env trimer as in
    (d), but with glycans shown as a blue mesh ensemble of overlaid conformations sampled
    during a 1 µs-long simulation. f Quantification of the accessible surface area (light
    gray), glycanshielded area (dark blue), and membrane-occluded area (purple) for the antigenic
    regions represented in (e, f) using a probe radius of 7.2 Å. For each stacked bar, values
    were pooled across five independent simulation trajectories (n = 5) initiated with distinct
    velocity seeds. Within each trajectory, surface areas were calculated over 1051 sampled
    frames and three protomers per frame (15,765 total measurements). Error bars indicate
    the standard deviation of the pooled values across all sampled frames. Source data are
    provided as a Source Data file.'
