    the protein is represented with a light blue surface, with each protomer differentiated
    by distinct shades. The membrane is depicted in purple, with lipid headgroups represented
    as van der Waals spheres. b Rotated and zoomed-in view of the MPER peptide region (yellow),
    focusing on its spatial arrangement within the viral membrane (purple), with two MPER
    peptides positioned closer to the viewpoint and prominently exposed, and the third further
    away buried in the membrane. c The 10E8 Fab (green cartoons) was docked onto the Env by
    fitting the MPER peptide from the 10E8 Fab–MPER complex (PDB ID: 4G6F56) to the most exposed
    MPER region sampled in our simulations, demonstrating how it fits into the structural
    pocket formed by tilting-induced rearrangements of the MPER. d Quantification of the MPER
    accessible surface area (yellow), glycan-shielded area (dark blue), and membrane-occluded
    area (purple) as a function of Env tilt angle (x-axis: 0–10°, 10–20°, 20–30°, >30°). Values
    were pooled across five independent simulation trajectories initiated with distinct velocity
    seeds and grouped into four tilt-angle ensembles. For each frame, only the protomer with
    the maximum MPER accessible surface area was considered. The number of sampled frames
    contributing to each ensemble was 10,625, 6,085, 23,228, and 12,567, respectively. For
    each ensemble, mean surface areas were calculated from all sampled frames within that
    bin. Error bars represent the standard error of the mean (SEM) calculated from the pooled
    frame-level values in each ensemble. Source data are provided as a Source Data file.'
