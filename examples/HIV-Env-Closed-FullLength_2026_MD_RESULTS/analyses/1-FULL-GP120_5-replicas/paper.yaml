- figure: 2
  file: fig2.png
  section: moves
  title: MD simulations and Cryo-ET reveal pronounced Env tilting motion.
  caption: 'MD simulations and Cryo-ET reveal pronounced Env tilting motion. a A representative
    snapshot of the Env protein showing significant tilting motion relative to the membrane.
    The Env is displayed with a transparent blue representation, the membrane with a purple
    surface, and N-glycans are shown with thin blue sticks. N-glycans N88 and N611 are colored
    in yellow and red, respectively. A tilt angle of ~30.0° is indicated by drawn yellow cylinders.
    b The plot on the left displays the time evolution (x-axis, ns) of the Env tilt angle
    (y-axis, degree) across the five independent MD simulation replicates for both the base
    system (blue lines) and the N88A + N611A mutant (black lines). The plot on the right shows
    the kernel density distribution (x-axis) of Env tilt angles (y-axis, degree). c Deconvoluted
    tomogram slice of a virus-like particle showing Env (blue) coating the membrane surface
    (purple). d Same tomogram slice as (c) with representative upright and tilted Envs indicated.
    e Top: Inlay is a closer look at two Envs. An upright Env is on the left and a tilted
    Env is on the right. Bottom: Upright and tilted conformations of Env extracted from MD
    simulations are overlayed on the respective upright and tilted Envs shown in the panel
    above. f Subtomogram average density of unliganded Env. The left panel shows a central
    slice through the averaged density with dashed lines (1 and 2) indicating the positions
    of the orthogonal sections along the trimer axis, which are displayed on the right. g
    Histogram and box-and-whisker plot of the Env tilt angle distribution from the cryo-ET
    dataset. Tilt angles were calculated for n = 4396 Env subtomogram particles extracted
    from 239 independent tomograms (565 enveloped virus-like particles). Each data point represents
    one Env trimer measurement. Values are binned by rounding to the nearest multiple of 3.
    Range, interquartile range, and median values are shown. Source data are provided as a
    Source Data file.'
