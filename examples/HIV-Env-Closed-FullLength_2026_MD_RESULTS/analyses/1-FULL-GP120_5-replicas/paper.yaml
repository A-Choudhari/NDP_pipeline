  section: system
  title: Modeling and simulations of the full-length, glycosylated HIV-1 Env trimer in the
    closed state.
  caption: 'Modeling and simulations of the full-length, glycosylated HIV-1 Env trimer in
    the closed state. a Workflow of the assembly of the ectodomain, membrane-proximal external
    region (MPER), transmembrane domain (TMD), and cytoplasmic tail (CT) domain into the full-length,
    glycosylated model of the HIV-1 Env trimer embedded into an all-atom membrane bilayer
    mimicking the composition of the viral budding site. The protein is depicted with light
    blue cartoons, with each protomer differentiated by distinct shades. N-glycans are shown
    in van der Waals (vdW) representation: GlcNAc in blue, mannose in green, fucose in red,
    galactose in yellow, and sialic acid in purple. Lipid headgroups are depicted as vdW spheres,
    with shades of purple (from darker to lighter) representing DPPC, POPE, POPS, PSM, and
    POPC, and pink indicating CHOL. Lipid tails are shown in licorice representation. b Oblique
    view of the fully assembled, glycosylated Env trimer embedded into an all-atom membrane
    bilayer. c Close-up view of the Env’s membrane-interacting region, where the palmitoylated
    cysteines within the CT are depicted with vdW spheres.'
  caption_basis: blank line after a complete sentence
