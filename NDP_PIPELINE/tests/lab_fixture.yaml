  data_availability: "Trajectories stored on lab storage; available on request"
  data_owner: {name: Pat Investigator, email: pi@example.edu, orcid:, affiliation: Example University}
  access_level:
  ai_training:
  data_location: {storage: "Test Lab cluster storage", uri:}
people: {}
topics:
