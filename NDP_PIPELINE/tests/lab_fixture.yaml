# lab_fixture.yaml -- the lab the tests run as, so they pass whatever a lab
# writes into the kit's own lab.yaml. Synthetic: no real person or storage.
lab:
  name: "Test Lab, Example University"
  short_name: "Test Lab"
  catalog_name: "Test Lab data catalog"
identifiers:
  prefix: TESTLAB
record_defaults:
