  covid-19:       {code: COV2, molecule: Spike, words: [covid, sars, spike, mpro, nsp14]}
  ebola:          {code: EBOV, words: [ebola]}
  lipid-vesicles: {code: LIPID, words: [vesicle, lipid]}
  p53:            {code: P53, words: [p53]}
  apobec3b:       {code: A3B, words: [apobec, a3b]}
  cpla2:          {code: CPLA2, words: [cpla2]}
index_topics:
